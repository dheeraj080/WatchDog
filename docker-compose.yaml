version: '3.8'

services:
  pathio-db:
    image: postgres:16-alpine
    container_name: pathio-db
    environment:
      POSTGRES_DB: pathio_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    networks:
      - pathio-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d pathio_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  pathio-net:
    driver: bridge

volumes:
  pgdata: