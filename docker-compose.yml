services:
  postgres:
    image: postgres:16-alpine
    container_name: watchdog-postgres
    environment:
      POSTGRES_DB: ${PG_DATABASE:-watchdog}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    # Ports omitted to keep database internal to Docker network; 
    # un-comment line below only if you need local GUI access outside Docker:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - watchdog
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-watchdog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: watchdog-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-watchdog}
    volumes:
      - mongo_data:/data/db
    networks:
      - watchdog
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: watchdog-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-api_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-watchdog}
    ports:
      - "127.0.0.1:15672:15672" # Management UI restricted to localhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - watchdog
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: watchdog-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - watchdog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchdog-app
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-watchdog}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-watchdog}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-watchdog}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-api_user}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-watchdog}
      RABBITMQ_QUEUE: api_hits
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - watchdog
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: watchdog-consumer
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-watchdog}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-watchdog}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-watchdog}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-api_user}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-watchdog}
      RABBITMQ_QUEUE: api_hits
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./logs:/app/logs
    networks:
      - watchdog
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  mongo_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  watchdog:
    driver: bridge